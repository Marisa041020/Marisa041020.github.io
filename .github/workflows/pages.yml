name: 构建并发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # 拉全量历史：脚本要靠 git 提交时间给照片排序
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 读取 Pages 配置
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建（hexo generate）
        run: npx hexo generate

      - name: 打包 public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
