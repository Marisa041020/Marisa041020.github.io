# ==========================================
# 灯下 · Butterfly 主题配置
# 只写了需要改的项，其余沿用主题默认值
# ==========================================

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-folder-open
  相册: /photos/ || fas fa-camera
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# 想加邮箱时补一行（换成真实地址）：
# fas fa-envelope: mailto:you@example.com || 写信 || '#8c5535'
social:
  fab fa-github: https://github.com/Marisa041020 || GitHub
  fab fa-bilibili: https://space.bilibili.com/52781172 || 哔哩哔哩 || '#fb7299'

# ---------- 图片 ----------
favicon: /img/favicon.svg

avatar:
  img: /img/avatar.webp
  effect: false

disable_top_img: false
default_top_img: /img/banner.svg
index_img: /img/banner.svg
archive_img: /img/banner.svg
tag_img: /img/banner.svg
footer_img: false

index_top_img_height: 360px

# 站点背景色（冷白，带一点天光）
background: '#f5fafd'

# 顶部图不再压一层黑：天蓝横幅自己就是底色，压了会发灰
mask:
  header: false
  footer: true

# 不启用封面图：没有配图时用卡片会空一块
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false

# 404 页
error_404:
  enable: true
  subtitle: 这一页没有留下来
  background: /img/error-page.svg

# ---------- 首页 ----------
subtitle:
  enable: false

index_layout: 1

# 1 = 显示 description（每篇开头的 description 字段）
index_post_content:
  method: 1
  length: 300

post_meta:
  page:
    date_type: created
    date_format: date
    categories: false
    tags: true
    label: true
  post:
    position: left
    date_type: created
    date_format: date
    categories: false
    tags: true
    label: true

# ---------- 文章页 ----------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: false

related_post:
  enable: true
  limit: 3
  date_type: created

post_pagination: 1

# 图片点开放大
lightbox: medium_zoom

# ---------- 页脚 ----------
footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text:

# ---------- 侧边栏 ----------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: false
  card_author:
    enable: true
    description: 列车终将驶向下一站
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/Marisa041020
  card_announcement:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
  card_categories:
    enable: false
  card_tags:
    enable: true
    limit: 20
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 6
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ---------- 按钮与暗色 ----------
readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1
  start: 19
  end: 6

rightside_scroll_percent: true

# ---------- 搜索 ----------
search:
  use: local_search
  placeholder: 搜点什么
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# ---------- 标签插件 ----------
# note 提示框（正文里用 {% note info %} ... {% endnote %}）
note:
  style: flat
  icons: true
  border_radius: 6
  light_bg_offset: 0

# mermaid 流程图：用到时才加载，历史时间轴/关系图都能画
mermaid:
  enable: true
  code_write: false
  open_in_new_tab: true
  zoom_pan: true

# ---------- 其他 ----------
share:
  use:

comments:
  use:
  count: false

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 字数统计 + 阅读时长（依赖 hexo-wordcount 插件，已在 package.json 里）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 图片懒加载：用浏览器原生 loading=lazy，不额外下载 JS
lazyload:
  enable: true
  native: true
  field: site
  placeholder:
  blur: false

# 分隔线用小书图标，替代默认的纯灰横线
hr_icon:
  enable: true
  icon: '\f02d'
  icon_top:

preloader:
  enable: false

enter_transitions: true
rounded_corners_ui: true
text_align_justify: true

# 注入自定义样式（source/css/custom.css）
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css?v=6">
  bottom:

# 正文版式：中文用这个字体栈，避免落到宋体发虚
font:
  global_font_size: 15px
  font_family: '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",-apple-system,"Segoe UI",sans-serif'

anchor:
  auto_update: true
  click_to_scroll: false

# 主题色：天蓝 + 白
# main 用在按钮底、标签悬停这类要压白字的场景，所以取 sky-500 而不是更浅的 sky-300；
# 正文里的链接用更深的 sky-600，白底上才够清楚
theme_color:
  enable: true
  main: '#0ea5e9'
  paginator: '#0ea5e9'
  button_hover: '#38bdf8'
  text_selection: '#bae6fd'
  link_color: '#0284c7'
  meta_color: '#7c93a4'
  hr_color: '#cfe8f8'
  code_foreground: '#0369a1'
  code_background: 'rgba(14,165,233,0.07)'
  toc_color: '#0284c7'
  blockquote_padding_color: '#7dd3fc'
  blockquote_background_color: 'rgba(14,165,233,0.06)'
  scrollbar_color: '#bae6fd'
